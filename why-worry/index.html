    <style>

<body>
    <div class="container">
        <h1 id="title">Why Worry?</h1>
        
        <div class="flowchart-container">
            <div class="question fade-in" id="question">Do You Have A Problem In Life?</div>
            <div class="options fade-in" id="options">

            </div>
            
            <div class="result" id="result"></div>
        </div>

        <div class="counter-container">
            <p id="counterText">See how many people found happiness with this!</p>
            <div class="counter" id="happinessCounter">Loading happiness count...</div>
            <div class="counter-image">

                    <img src="https://services.webestools.com/cpt_global/60637-7.png"
                         alt="Visitor Counter"
                         loading="lazy" />
                </a>

        </div>

        <div class="share-section" id="shareSection">
            <p id="shareText">Share this wisdom to brighten someone's day!</p>
            <div class="share-buttons">

                </div>
                <div class="share-btn instagram" id="instagramShare">
                    <i class="fab fa-instagram"></i>
                </div>
                <div class="share-btn telegram" id="telegramShare">
                    <i class="fab fa-telegram-plane"></i>
                </div>
                <div class="share-btn whatsapp" id="whatsappShare">
                    <i class="fab fa-whatsapp"></i>
                </div>
                <div class="share-btn facebook" id="facebookShare">
                    <i class="fab fa-facebook-f"></i>
                </div>
                <div class="share-btn twitter" id="twitterShare">
                    <i class="fab fa-twitter"></i>
                </div>
            </div>
        </div>

        <div class="footer">
            Made with <span style="color: #ef4444">💝</span> by <a href="https://nabilbinbillal.github.io/" target="_blank" rel="noopener noreferrer">Nabil Bin Billal</a>
        </div>
    </div>

    <button class="lang-switcher" id="langSwitcher">বাংলা</button>

    <script>
        // Language content
        const content = {
            en: {
                title: "Why Worry?",
                question1: "Do You Have A Problem In Life?",
                question2: "Can You Do Something About It?",
                yes: "Yes",
                no: "No",
                result1: "Then why worry? Enjoy life! 🌈",
                result2: "Then why worry? Take action! 💪",
                result3: "Then why worry? Let it go! 🕊️",
                counter: "This made people happy {count} times",
                counterText: "See how many people found happiness with this!",
                share: "Share this wisdom to brighten someone's day!",
                langBtn: "বাংলা"
            },
            bn: {
                title: "চিন্তা কেন?",
                question1: "আপনার কি জীবনে কোনো সমস্যা আছে?",
                question2: "আপনি কি এ সম্পর্কে কিছু করতে পারবেন?",
                yes: "হ্যাঁ",
                no: "না",
                result1: "তাহলে চিন্তা কেন? জীবন উপভোগ করুন! 🌈",
                result2: "তাহলে চিন্তা কেন? পদক্ষেপ নিন! 💪",
                result3: "তাহলে চিন্তা কেন? ছেড়ে দিন! যা হওয়ার তা হবেই! 🕊️",
                counter: "এটি বহু মানুষকে খুশি করেছে",
                counterText: "দেখুন এটি কতজন মানুষকে খুশি করেছে!",
                share: "এটি শেয়ার করে অন্যকে খুশি করুন!",
                langBtn: "English"
            }
        };

        // Check URL for language parameter
        const urlParams = new URLSearchParams(window.location.search);
        const urlLang = urlParams.get('lang');
        
        // Set initial language based on URL or default to English
        let currentLang = (urlLang === 'bn') ? 'bn' : 'en';

        // Format number with commas
        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        // Function to update counter display from FreeCounterStat
        function updateCounterDisplay() {
            const counterDiv = document.getElementById('sfc1ear5ewcqeuutkls1rmsxpmwbgmc9u3r');
            if (counterDiv && counterDiv.textContent) {
                const count = parseInt(counterDiv.textContent) || 0;
                document.getElementById('happinessCounter').textContent = 
                    content[currentLang].counter.replace('{count}', formatNumber(count));
            } else {
                document.getElementById('happinessCounter').textContent = 
                    content[currentLang].counter.replace('{count}', 'many');
            }
        }

        // Check counter every second until it loads
        const counterCheckInterval = setInterval(() => {
            updateCounterDisplay();
            const counterDiv = document.getElementById('sfc1ear5ewcqeuutkls1rmsxpmwbgmc9u3r');
            if (counterDiv && counterDiv.textContent) {
                clearInterval(counterCheckInterval);
            }
        }, 1000);

        // Flowchart elements
        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const resultEl = document.getElementById('result');
        const shareSection = document.getElementById('shareSection');
        const langSwitcher = document.getElementById('langSwitcher');

        let currentStep = 0;

        const steps = [
            {
                question: content[currentLang].question1,
                options: {
                    yes: { 
                        nextStep: 1,
                        emoji: "😔"
                    },
                    no: { 
                        result: content[currentLang].result1,
                        emoji: "😊",
                        color: "#10b981"
                    }
                }
            },
            {
                question: content[currentLang].question2,
                options: {
                    yes: { 
                        result: content[currentLang].result2,
                        emoji: "⚡",
                        color: "#10b981"
                    },
                    no: { 
                        result: content[currentLang].result3,
                        emoji: "🍃",
                        color: "#ef4444"
                    }
                }
            }
        ];

        function updateContent() {
            document.getElementById('title').textContent = content[currentLang].title;
            document.getElementById('shareText').textContent = content[currentLang].share;
            document.getElementById('counterText').textContent = content[currentLang].counterText;
            langSwitcher.textContent = content[currentLang].langBtn;
            
            document.getElementById('yesText').textContent = content[currentLang].yes;
            document.getElementById('noText').textContent = content[currentLang].no;
            
            updateCounterDisplay();
            
            steps[0].question = content[currentLang].question1;
            steps[1].question = content[currentLang].question2;
            steps[0].options.no.result = content[currentLang].result1;
            steps[1].options.yes.result = content[currentLang].result2;
            steps[1].options.no.result = content[currentLang].result3;
        }

        function showStep(stepIndex) {
            if (stepIndex === undefined || stepIndex >= steps.length) {
                showResult();
                return;
            }

            currentStep = stepIndex;
            const step = steps[stepIndex];
            
            questionEl.classList.remove('fade-in');
            questionEl.classList.add('fade-out');
            optionsEl.classList.remove('fade-in');
            optionsEl.classList.add('fade-out');

            setTimeout(() => {
                questionEl.textContent = step.question;
                
                const yesOption = step.options.yes;
                const noOption = step.options.no;
                
                optionsEl.innerHTML = `
                    <button class="btn btn-yes" data-choice="yes"><span id="yesText">${content[currentLang].yes}</span> <span class="btn-emoji">${yesOption.emoji || "✅"}</span></button>
                    <button class="btn btn-no" data-choice="no"><span id="noText">${content[currentLang].no}</span> <span class="btn-emoji">${noOption.emoji || "❌"}</span></button>
                `;
                
                questionEl.classList.remove('fade-out');
                questionEl.classList.add('fade-in');
                optionsEl.classList.remove('fade-out');
                optionsEl.classList.add('fade-in');
                
                resultEl.classList.remove('show');
                shareSection.classList.remove('show');
            }, 300);
        }

        function showResult(result, color) {
            questionEl.classList.remove('fade-in');
            questionEl.classList.add('fade-out');
            optionsEl.classList.remove('fade-in');
            optionsEl.classList.add('fade-out');

            setTimeout(() => {
                resultEl.textContent = result;
                resultEl.style.color = color || 'var(--secondary)';
                
                resultEl.style.display = 'block';
                shareSection.style.display = 'block';
                resultEl.classList.add('show');
                shareSection.classList.add('show');
                
                questionEl.style.display = 'none';
                optionsEl.style.display = 'none';
            }, 300);
        }

        // Event listeners
        document.addEventListener('click', (e) => {
            const btn = e.target.closest('.btn');
            if (!btn || !btn.parentElement.isSameNode(optionsEl)) return;

            const choice = btn.dataset.choice;
            const option = steps[currentStep].options[choice];

            if (option.result) {
                showResult(option.result, option.color);
            } else {
                showStep(option.nextStep);
            }
        });

        langSwitcher.addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'bn' : 'en';
            
            // Update URL without reloading
            const newUrl = new URL(window.location.href);
            newUrl.searchParams.set('lang', currentLang);
            window.history.pushState({}, '', newUrl);
            
            updateContent();
            showStep(currentStep);
        });

        // Share buttons functionality
        document.getElementById('copyLinkShare').addEventListener('click', () => {
            navigator.clipboard.writeText(window.location.href).then(() => {
                const btn = document.getElementById('copyLinkShare');
                const originalContent = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i>';
                setTimeout(() => {
                    btn.innerHTML = originalContent;
                }, 1000);
            });
        });

        document.getElementById('instagramShare').addEventListener('click', () => {
            window.open(`https://www.instagram.com/?url=${encodeURIComponent(window.location.href)}`, '_blank', 'noopener,noreferrer');
        });

        document.getElementById('telegramShare').addEventListener('click', () => {
            window.open(`https://t.me/share/url?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent(content[currentLang].share)}`, '_blank', 'noopener,noreferrer');
        });

        document.getElementById('whatsappShare').addEventListener('click', () => {
            window.open(`https://wa.me/?text=${encodeURIComponent(content[currentLang].share + " " + window.location.href)}`, '_blank', 'noopener,noreferrer');
        });

        document.getElementById('facebookShare').addEventListener('click', () => {
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}`, '_blank', 'noopener,noreferrer');
        });

        document.getElementById('twitterShare').addEventListener('click', () => {
            window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(content[currentLang].share + " " + window.location.href)}`, '_blank', 'noopener,noreferrer');
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            updateCounterDisplay();
            updateContent();
            showStep(0);
            
            // Periodically update counter
            setInterval(updateCounterDisplay, 5000);
        });
    </script>
