    .glitch-text::before,

      content: attr(data-text);
      position: absolute;
      left: 0;
      width: 100%;
      overflow: hidden;
      color: #00ff9f;
      clip: rect(0, 0, 0, 0);
    }
    .glitch-text::before {
      animation: glitchTop 1s infinite linear alternate-reverse;

    .glitch-text::after {
      animation: glitchBottom 1.5s infinite linear alternate-reverse;
      color: #00ffff;
    }
    @keyframes glitchTop {
      0% { clip: rect(0, 9999px, 0, 0); }
      10% { clip: rect(0, 9999px, 5px, 0); transform: translate(-2px, -2px); }
      20% { clip: rect(0, 9999px, 3px, 0); transform: translate(2px, -1px); }
      100% { clip: rect(0, 9999px, 0, 0); }
    }

      0% { clip: rect(0, 9999px, 0, 0); }
      10% { clip: rect(5px, 9999px, 10px, 0); transform: translate(1px, 1px); }
      20% { clip: rect(3px, 9999px, 8px, 0); transform: translate(-1px, 2px); }
      100% { clip: rect(0, 9999px, 0, 0); }
    }

<body>
  <div class="loader-wrapper">
    <div class="glitch-text" id="terminalText" data-text="Loading: Nabil Bin Billal's Portfolio">Loading: Nabil Bin Billal's Portfolio</div>
    <div class="cursor"></div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <iframe
    id="portfolioFrame"
    name="nabilbinbillal-portfolio"
    title="Nabil Bin Billal Portfolio Website"
    onload="document.body.classList.add('loaded');">
  </iframe>

  <script>
  const terminalEl = document.getElementById("terminalText");
  const progressFill = document.getElementById("progressFill");

  const messages = [
    "Loading: Nabil Bin Billal's Portfolio",
    "Decrypting thoughts...",
    "Analyzing digital footprint...",
    "Optimizing creativity cores...",
    "Verifying Nabil's presence...",
    "Initiating Portfolio Drive..."
  ];

  let i = 0, textPos = 0, percent = 0;

  // Type Effect Function
  function typeEffect() {
    if (i < messages.length) {
      if (textPos < messages[i].length) {
        terminalEl.textContent = messages[i].substring(0, textPos + 1);
        terminalEl.setAttribute("data-text", terminalEl.textContent);
        textPos++;
        setTimeout(typeEffect, 30);
      } else {
        textPos = 0;
        i++;
        setTimeout(typeEffect, 1000);
      }
    }
  }

  // Progress Bar Animation
  function progressAnimation() {
    if (percent < 100) {
      percent++;
      progressFill.style.width = percent + "%";
      setTimeout(progressAnimation, 25);
    }
  }

  // Function to handle smooth scroll when a hash is changed
  function scrollToSection() {
    const section = window.location.hash;
    if (section) {
      const targetElement = document.querySelector(section);
      if (targetElement) {
        targetElement.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }
  }

  // Update the active navigation link
  function updateActiveNavLink() {
    const sections = document.querySelectorAll("section");
    const navLinks = document.querySelectorAll("nav a");
    
    let currentSection = "";
    sections.forEach(section => {
      const rect = section.getBoundingClientRect();
      if (rect.top <= window.innerHeight / 2 && rect.bottom >= window.innerHeight / 2) {
        currentSection = section.id;
      }
    });

    navLinks.forEach(link => {
      if (link.getAttribute("href") === `#${currentSection}`) {
        link.classList.add("active");
      } else {
        link.classList.remove("active");
      }
    });
  }

  // Prevent default scrolling behavior when clicking on nav links
  document.querySelectorAll("nav a").forEach(anchor => {
    anchor.addEventListener("click", function (e) {
      e.preventDefault();
      window.location.hash = this.getAttribute("href");
      scrollToSection();
    });
  });

  // Handle hash changes and scroll behavior
  window.addEventListener("hashchange", function () {
    scrollToSection();
    updateActiveNavLink();
  });

  // Automatically scroll to the section when the page loads (if hash exists)
  document.addEventListener("DOMContentLoaded", function () {
    scrollToSection();
    updateActiveNavLink();
  });

  // Hash routing logic for iframe source
  const hash = window.location.hash.substring(1); // Remove the '#' symbol
  const iframeSrc = hash ? `https://nabilbinbillal.pages.dev/#${hash}` : "https://nabilbinbillal.pages.dev/";

  document.getElementById("portfolioFrame").src = iframeSrc;

  // Call type effect and progress animation
  typeEffect();
  progressAnimation();

  // Scroll listener for updating active nav item as you scroll
  window.addEventListener('scroll', updateActiveNavLink);
</script>
