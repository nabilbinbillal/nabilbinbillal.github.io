    <!-- Styles -->
   <style>
    @import url("https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap");

    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0d0d0d;
      color: #00ff9f;
      font-family: "Share Tech Mono", monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .loader-wrapper {
      position: absolute;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .glitch-text {
      font-size: 16px;
      letter-spacing: 1px;
      white-space: nowrap;
      position: relative;
      margin-bottom: 10px;
    }

    .glitch-text::before,
    .glitch-text::after {
      content: attr(data-text);
      position: absolute;
      left: 0;
      width: 100%;
      overflow: hidden;
      color: #00ff9f;
      clip: rect(0, 0, 0, 0);
    }

    .glitch-text::before {
      animation: glitchTop 1s infinite linear alternate-reverse;
      color: #ff00ff;
    }

    .glitch-text::after {
      animation: glitchBottom 1.5s infinite linear alternate-reverse;
      color: #00ffff;
    }

    @keyframes glitchTop {
      0% {
        clip: rect(0, 9999px, 0, 0);
      }
      10% {
        clip: rect(0, 9999px, 5px, 0);
        transform: translate(-2px, -2px);
      }
      20% {
        clip: rect(0, 9999px, 3px, 0);
        transform: translate(2px, -1px);
      }
      100% {
        clip: rect(0, 9999px, 0, 0);
      }
    }

    @keyframes glitchBottom {
      0% {
        clip: rect(0, 9999px, 0, 0);
      }
      10% {
        clip: rect(5px, 9999px, 10px, 0);
        transform: translate(1px, 1px);
      }
      20% {
        clip: rect(3px, 9999px, 8px, 0);
        transform: translate(-1px, 2px);
      }
      100% {
        clip: rect(0, 9999px, 0, 0);
      }
    }

    .progress-bar {
      width: 220px;
      height: 8px;
      border: 1px solid #00ff9f;
      margin-top: 10px;
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #00ff9f;
      width: 0%;
      transition: width 0.2s;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .loaded iframe {
      opacity: 1;
    }

    .loaded .loader-wrapper {
      display: none;
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 18px;
      background: #00ff9f;
      animation: blink 0.7s steps(1) infinite;
      margin-left: 4px;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <div class="loader-wrapper">
    <div class="glitch-text" id="terminalText" data-text="Waking up terminal...">Waking up terminal...</div>
    <div class="cursor"></div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <iframe 
    name="nabilbinbillal-portfolio"
    src="https://nabilbinbillal.pages.dev/"
    onload="document.body.classList.add('loaded');"
    title="Nabil Bin Billal Portfolio Website">
  </iframe>

  <script>
    const terminalEl = document.getElementById("terminalText");
    const progressFill = document.getElementById("progressFill");

    const messages = [
      "Waking up terminal...",
      "Decrypting thoughts...",
      "Analyzing digital footprint...",
      "Optimizing creativity cores...",
      "Verifying Nabil's presence...",
      "Initiating Portfolio Drive..."
    ];

    let i = 0;
    let textPos = 0;
    let percent = 0;
    let loaded = false;

    function typeEffect() {
      if (i < messages.length) {
        if (textPos < messages[i].length) {
          terminalEl.textContent = messages[i].substring(0, textPos + 1);
          terminalEl.setAttribute("data-text", terminalEl.textContent);
          textPos++;
          setTimeout(typeEffect, 30);
        } else {
          textPos = 0;
          i++;
          setTimeout(typeEffect, 1000);
        }
      }
    }

    function animateProgress() {
      if (percent < 100 && !loaded) {
        percent += Math.random() * 3;
        if (percent > 100) percent = 100;
        progressFill.style.width = percent + "%";
        setTimeout(animateProgress, 60);
      }
    }

    window.addEventListener("load", () => {
      loaded = true;
      percent = 100;
      progressFill.style.width = "100%";
      setTimeout(() => {
        document.body.classList.add("loaded");
      }, 500);
    });

    setTimeout(() => {
      if (!loaded) {
        typeEffect();
        animateProgress();
      }
    }, 500);
  </script>
</body>
