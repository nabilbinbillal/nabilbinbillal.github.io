<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Find answers to common questions about Nabil Bin Billal's services, achievements, and more.">
    <meta name="keywords" content="FAQ, Nabil Bin Billal, web developer, MERN Stack, Android Developer, content writer, scientific writer">
    <meta name="author" content="Nabil Bin Billal">
    <meta property="og:title" content="FAQ - Nabil Bin Billal">
    <meta property="og:description" content="Discover insights about Nabil Bin Billal's expertise and services.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nabilbinbillal.github.io/faq">
    <meta property="og:image" content="https://nabilbinbillal.github.io/jsm-logo.png">
    <title>FAQ - Nabil Bin Billal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            transition: all 0.4s ease;
            background-color: #f4f4f4;
            color: #333;
        }

        /* Container Styling */
        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #007BFF;
            text-shadow: 0px 1px 5px rgba(0, 123, 255, 0.7);
        }

        /* FAQ Styling */
        .faq {
            margin-bottom: 20px;
        }

        .faq h2 {
            font-size: 1.2em;
            cursor: pointer;
            background: #007BFF;
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.3s, transform 0.3s;
        }

        .faq h2:hover {
            background: #0056b3;
            transform: scale(1.02);
        }

        .faq p {
            display: none;
            padding: 15px;
            background: #f9f9f9;
            border-left: 5px solid #007BFF;
            margin-top: 10px;
            border-radius: 8px;
        }

        .faq.open p {
            display: block;
        }

        /* Light and Dark Theme Toggle */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #f4f4f4;
            border: 2px solid #007BFF;
            border-radius: 20px;
            width: 50px;
            height: 25px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.4s;
        }

        .theme-toggle .toggle-circle {
            background: #007BFF;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-left: 5px;
            transition: all 0.4s;
        }

        .dark-mode .theme-toggle {
            background: #333;
        }

        .dark-mode .theme-toggle .toggle-circle {
            margin-left: 25px;
            background: #f4f4f4;
        }

        /* Social Icons */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .social-icon {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #007BFF;
            color: #fff;
            font-size: 24px;
            transition: transform 0.3s, box-shadow 0.3s, background 0.3s;
        }

        .social-icon:hover {
            transform: scale(1.2);
            box-shadow: 0 0 15px rgba(0, 123, 255, 0.8);
        }

        .social-icon.facebook:hover {
            background: #4267B2;
        }

        .social-icon.instagram:hover {
            background: #C13584;
        }

        .social-icon.linkedin:hover {
            background: #0077B5;
        }

        /* Footer */
        footer {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            background: #f4f4f4;
            color: #333;
        }

        /* Dark Mode */
        .dark-mode {
            background: #121212;
            color: #e0e0e0;
        }

        .dark-mode .container {
            background: #1e1e1e;
        }

        .dark-mode footer {
            background: #333;
        }
    </style>
</head>
<body>
    <div class="theme-toggle" onclick="toggleTheme()">
        <div class="toggle-circle"></div>
    </div>

    <div class="container">
        <h1>Frequently Asked Questions (FAQ)</h1>

        <!-- FAQ Section -->
        <div class="faq">
            <h2>Who is Nabil Bin Billal?</h2>
            <p>Nabil is a web developer, MERN stack specialist, and a scientific writer with achievements in content creation.</p>
        </div>

        <!-- Social Icons -->
        <div class="social-icons">
            <a href="#" class="social-icon facebook"><i class="fab fa-facebook-f"></i></a>
            <a href="#" class="social-icon instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" class="social-icon linkedin"><i class="fab fa-linkedin-in"></i></a>
        </div>
    </div>

    <footer>
        © 2024 Nabil Bin Billal. All Rights Reserved.
    </footer>

    <script>
        const body = document.body;

        function toggleTheme() {
            body.classList.toggle('dark-mode');
        }

        document.querySelectorAll('.faq h2').forEach(question => {
            question.addEventListener('click', () => {
                const faq = question.parentElement;
                faq.classList.toggle('open');
            });
        });
    </script>
</body>
</html>
