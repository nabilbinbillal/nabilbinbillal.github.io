<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Find answers to common questions about Nabil Bin Billal's services, achievements, and more.">
    <meta name="keywords" content="FAQ, Nabil Bin Billal, web developer, MERN Stack, Android Developer, content writer, scientific writer">
    <meta name="author" content="Nabil Bin Billal">
    <meta property="og:title" content="FAQ - Nabil Bin Billal">
    <meta property="og:description" content="Discover insights about Nabil Bin Billal's expertise and services.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nabilbinbillal.github.io/faq">
    <meta property="og:image" content="https://nabilbinbillal.github.io/jsm-logo.png">
    <title>FAQ - Nabil Bin Billal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        /* General Styling */
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            color: #333;
            transition: all 0.4s ease-in-out;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background: linear-gradient(145deg, #ffffff, #f9f9f9);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            transition: background 0.4s;
        }

        h1 {
            text-align: center;
            background: linear-gradient(90deg, #00bcd4, #007b9e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.2em;
            margin-bottom: 20px;
        }

        /* FAQ Styling */
        .faq {
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .faq h2 {
            font-size: 1.2em;
            cursor: pointer;
            margin: 0;
            padding: 15px;
            background: linear-gradient(90deg, #00bcd4, #007b9e);
            color: #fff;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.4s ease, color 0.4s ease;
        }

        .faq h2:hover {
            background: linear-gradient(90deg, #007b9e, #00bcd4);
        }

        .faq.open h2 {
            background: linear-gradient(90deg, #007b9e, #00bcd4);
        }

        .faq p {
            display: none;
            padding: 15px;
            background: #f9f9f9;
            color: #333;
            border-radius: 0 0 8px 8px;
            transition: background 0.4s ease, color 0.4s ease;
        }

        .faq.open p {
            display: block;
        }

        /* Light/Dark Theme Toggle */
        .theme-toggle {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .theme-toggle input {
            display: none;
        }

        .slider {
            position: relative;
            width: 60px;
            height: 30px;
            background: linear-gradient(90deg, #00bcd4, #007b9e);
            border-radius: 15px;
            cursor: pointer;
            transition: background 0.4s;
        }

        .slider:before {
            content: '';
            position: absolute;
            width: 25px;
            height: 25px;
            background: #fff;
            border-radius: 50%;
            top: 2.5px;
            left: 2.5px;
            transition: transform 0.4s, background 0.4s;
        }

        input:checked + .slider {
            background: linear-gradient(90deg, #ff8c00, #ff4500);
        }

        input:checked + .slider:before {
            transform: translateX(30px);
            background: #ff5722;
        }

        body.dark {
            background-color: #333;
            color: #fff;
        }

        body.dark .container {
            background: linear-gradient(145deg, #444, #555);
        }

        body.dark .faq p {
            background: #444;
            color: #fff;
        }

        body.dark .faq h2 {
            background: linear-gradient(90deg, #ff5722, #ff8c00);
            color: #fff;
        }

        body.dark .faq h2:hover {
            background: linear-gradient(90deg, #ff8c00, #ff5722);
        }

        /* Social Icons */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }

        .social-icon {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 50px;
            height: 50px;
            background: #ccc;
            color: #fff;
            border-radius: 50%;
            text-decoration: none;
            font-size: 24px;
            transition: transform 0.3s, box-shadow 0.3s, background 0.3s;
        }

        .social-icon.facebook:hover {
            background: linear-gradient(90deg, #4267B2, #264c7f);
            box-shadow: 0 0 15px #4267B2;
        }

        .social-icon.linkedin:hover {
            background: linear-gradient(90deg, #0077B5, #004a78);
            box-shadow: 0 0 15px #0077B5;
        }

        .social-icon.instagram:hover {
            background: linear-gradient(90deg, #E1306C, #962850);
            box-shadow: 0 0 15px #E1306C;
        }

        .social-icon.youtube:hover {
            background: linear-gradient(90deg, #FF0000, #b80000);
            box-shadow: 0 0 15px #FF0000;
        }

        .social-icon.twitter:hover {
            background: linear-gradient(90deg, #1DA1F2, #157ab5);
            box-shadow: 0 0 15px #1DA1F2;
        }

        .social-icon.github:hover {
            background: linear-gradient(90deg, #333, #222);
            box-shadow: 0 0 15px #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Frequently Asked Questions (FAQ)</h1>

        <!-- Theme Toggle -->
        <div class="theme-toggle">
            <label>
                <input type="checkbox" id="theme-switch">
                <div class="slider"></div>
            </label>
        </div>

        <!-- FAQs -->
        <div class="faq">
            <h2>Who is Nabil Bin Billal? <i class="fas fa-chevron-down"></i></h2>
            <p>Nabil Bin Billal is a talented web developer, content creator, and scientific writer...</p>
        </div>

        <!-- Repeat similar structure for all questions -->

        <!-- Social Icons -->
        <div class="social-icons">
            <a href="#" class="social-icon facebook"><i class="fab fa-facebook-f"></i></a>
            <a href="#" class="social-icon linkedin"><i class="fab fa-linkedin-in"></i></a>
            <a href="#" class="social-icon instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" class="social-icon youtube"><i class="fab fa-youtube"></i></a>
            <a href="#" class="social-icon twitter"><i class="fab fa-twitter"></i></a>
            <a href="#" class="social-icon github"><i class="fab fa-github"></i></a>
        </div>
    </div>

    <script>
        const themeSwitch = document.getElementById('theme-switch');
        themeSwitch.addEventListener('change', () => {
            document.body.classList.toggle('dark');
        });

        document.querySelectorAll('.faq h2').forEach(faqHeader => {
            faqHeader.addEventListener('click', () => {
                const faq = faqHeader.parentElement;
                faq.classList.toggle('open');
            });
        });
    </script>
</body>
</html>
